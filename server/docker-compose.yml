# Сервер лиги + (по желанию) Caddy с автоматическим HTTPS.
#   docker compose --profile https up -d --build   — с Caddy на портах 80/443
#   docker compose up -d --build                    — только сервер на 127.0.0.1:8787 (за своим nginx/caddy)
services:
  league:
    build: .
    restart: unless-stopped
    environment:
      - DB_PATH=/data/levelup.db
    volumes:
      - ${DATA_DIR:-./data}:/data
    ports:
      - "127.0.0.1:${LEAGUE_PORT:-8787}:8787"

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [league]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
