# Автоматический деплой сервера лиги в Cloudflare.
# Нужны секреты репозитория: CLOUDFLARE_API_TOKEN и CLOUDFLARE_ACCOUNT_ID
# (Settings → Secrets and variables → Actions). Запускается при изменении папки server/
# и вручную: Actions → «Deploy league server» → Run workflow.
name: Deploy league server

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Проверить секреты
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Добавь секреты CLOUDFLARE_API_TOKEN и CLOUDFLARE_ACCOUNT_ID в Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Установить Wrangler
        run: npm install --no-save wrangler@4.156.1

      - name: Найти или создать базу D1
        run: |
          find_db() {
            npx wrangler d1 list --json 2>/dev/null | node -e '
              let s = ""; process.stdin.on("data", (d) => s += d).on("end", () => {
                const list = JSON.parse(s.slice(s.indexOf("[")));
                const db = list.find((x) => x.name === "levelup");
                process.stdout.write(db ? (db.uuid || db.database_id || db.id || "") : "");
              });'
          }
          DB_ID="$(find_db)"
          if [ -z "$DB_ID" ]; then
            echo "База не найдена — создаю levelup"
            npx wrangler d1 create levelup
            DB_ID="$(find_db)"
          fi
          if [ -z "$DB_ID" ]; then echo "::error::Не удалось получить id базы D1"; exit 1; fi
          echo "D1: $DB_ID"
          sed -i "s/__DB_ID__/$DB_ID/" wrangler.toml

      - name: Применить схему базы
        run: npx wrangler d1 execute levelup --remote --file=schema.sql

      - name: Развернуть Worker
        run: npx wrangler deploy | tee deploy.log

      - name: Адрес сервера
        run: |
          URL="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          echo "### Сервер лиги развёрнут" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Адрес для приложения: **${URL:-смотри лог шага «Развернуть Worker»}**" >> "$GITHUB_STEP_SUMMARY"
          echo "Адрес сервера: ${URL}"
